<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>白银定价计算器 - 保8%毛利 + 利润明细</title>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f7f0;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #c0c0c0; /* 改为银色 */
    }
    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .result {
      background: #eef7ff;
      padding: 15px;
      border-left: 4px solid #007acc;
      margin-top: 15px;
      font-size: 1.1em;
    }
    .profit-detail {
      background: #f0fff4;
      padding: 12px;
      border-left: 4px solid #2e8b57;
      margin-top: 10px;
      font-size: 0.95em;
    }
    .note {
      font-size: 0.9em;
      color: #666;
      margin-top: 10px;
    }
    button {
      background: #c0c0c0; /* 银色按钮 */
      color: #333;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
    button:hover {
      background: #a9a9a9;
    }
    .highlight {
      color: #c0c0c0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>✨ 白银定价计算器</h1>
  <p style="text-align:center; color:#666">保 ≥8% 毛利率 | 自动保存历史记录 | 显示利润明细</p>

  <div class="section">
    <label for="marketPrice">大盘银价（元/克）</label>
    <input type="number" id="marketPrice" step="0.01" placeholder="例如：5.8">

    <label for="markup">你的加价（元/克）</label>
    <input type="number" id="markup" step="0.01" placeholder="例如：0.5">

    <label for="weight">克重（克）</label>
    <select id="weight">
      <option value="100">100g</option>
      <option value="500">500g</option>
      <option value="1000">1000g</option>
      <option value="custom">自定义</option>
    </select>
    <input type="number" id="customWeight" step="1" placeholder="输入克重" style="display:none; margin-top:5px;">

    <label for="processingFee">加工费（元）</label>
    <input type="number" id="processingFee" step="0.01" placeholder="例如：80">

    <label for="shipping">运费（元）</label>
    <input type="number" id="shipping" step="0.01" value="24">

    <label>平台费率（自动合计）</label>
    <div>
      技术服务费：<input type="number" id="techFeeRate" step="0.001" value="0.006" style="width:45%">  
      佣金：<input type="number" id="commissionRate" step="0.001" value="0.008" style="width:45%">
    </div>

    <label for="targetMargin">目标毛利率（小数，如0.08=8%）</label>
    <input type="number" id="targetMargin" step="0.01" value="0.08">

    <button onclick="calculate()">立即计算</button>
  </div>

  <div class="section">
    <h3>💰 定价建议 & 利润明细</h3>
    <div class="result" id="result">请填写参数后点击“立即计算”</div>
    <div class="profit-detail" id="profitDetail" style="display:none;"></div>
    <div class="note">
      公式：<br>
      最低售价 = [(大盘价 + 加价) × 克重 + 加工费 + 运费] ÷ [1 - (技术服务费率 + 佣金费率) - 目标毛利率]
    </div>
  </div>

        const saved = localStorage.getItem(id);

          document.getElementById(id).value = saved;
        }

          select.value = 'custom';
          document.getElementById('customWeight').style.display = 'block';
          document.getElementById('customWeight').value = savedWeight;
